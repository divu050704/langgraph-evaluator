[project]
name = "langgraph-evaluator"
version = "0.1.0"
description = "Statistical evaluation, distributional regression testing, and CI/CD quality gating for LangGraph applications"
readme = "README.md"
authors = [
    { name = "divu050704", email = "divyanshu14472@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepeval>=4.2.2",
    "grandalf>=0.8",
    "langgraph>=1.2.11",
    "scipy>=1.18.1",
]

[project.scripts]
langgraph-evaluator = "langgraph_evaluator:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
